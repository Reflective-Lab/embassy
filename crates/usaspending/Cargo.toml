[package]
name = "converge-embassy-usaspending"
description = "USAspending port — US federal award and obligation API."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["converge", "embassy", "usaspending", "federal", "spend"]
categories = ["api-bindings"]

[lib]
name = "embassy_usaspending"
path = "src/lib.rs"

[dependencies]
embassy-pack = { package = "converge-embassy-pack", path = "../pack", version = "1.1.1" }
converge-pack.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Live HTTP transport for api.usaspending.gov. No auth required.
manifold = { workspace = true, optional = true, features = ["fetch"] }
tokio = { workspace = true, optional = true }

[features]
default = []
# Bring in the live USAspending transport: HTTP fetch + JSON parse
# against https://api.usaspending.gov/api/v2/awards/{award_id}/.
# Federal-spend data is open by statute; no auth required.
live = ["dep:manifold", "dep:tokio"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
