[package]
name = "converge-embassy-sec-edgar"
description = "SEC EDGAR port — US securities filings (CIK, AccessionNumber, FormType, Filing) for Converge formations."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["converge", "embassy", "sec", "edgar", "filings"]
categories = ["api-bindings"]

[lib]
name = "embassy_sec_edgar"
path = "src/lib.rs"

[dependencies]
embassy-pack = { package = "converge-embassy-pack", path = "../pack", version = "1.1.1" }
converge-pack.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Live HTTP+HTML transport — only pulled in when the `live` feature is
# enabled. Stub-only consumers (CI loops, formation harnesses, unit
# tests) see no manifold/tokio surface.
manifold = { workspace = true, optional = true, features = ["fetch", "extract"] }
tokio = { workspace = true, optional = true }

[features]
default = []
# Bring in the live SEC EDGAR transport: HTTP fetch (with SEC's required
# User-Agent), HTML section locator, multi-selector heading extractor.
# Tests on this feature use canned HTML fixtures — no network in CI.
live = ["dep:manifold", "dep:tokio"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
