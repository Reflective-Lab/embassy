[package]
name = "converge-embassy-gleif"
description = "GLEIF port — Global Legal Entity Identifier (LEI ISO 17442 + ownership relationships) for Converge formations."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["converge", "embassy", "gleif", "lei", "counterparty"]
categories = ["api-bindings"]

[lib]
name = "embassy_gleif"
path = "src/lib.rs"

[dependencies]
embassy-pack = { package = "converge-embassy-pack", path = "../pack", version = "1.2.0" }
converge-pack.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Live HTTP transport — only pulled in when the `live` feature is
# enabled. Stub-only consumers (CI loops, formation harnesses, unit
# tests) see no manifold/tokio surface. Same pattern as sec-edgar's
# `live` feature.
manifold = { workspace = true, optional = true, features = ["fetch"] }
tokio = { workspace = true, optional = true }

[features]
default = []
# Bring in the live GLEIF transport: HTTP fetch + JSON:API parse against
# the free public endpoint at https://api.gleif.org/api/v1/lei-records.
# No auth required (GLEIF data is CC0). Tests for this feature use
# canned JSON fixtures — no network in CI.
live = ["dep:manifold", "dep:tokio"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
