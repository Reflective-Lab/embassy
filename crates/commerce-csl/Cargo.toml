[package]
name = "converge-embassy-commerce-csl"
description = "Commerce CSL port — US Department of Commerce Consolidated Screening List (BIS Entity List, Denied Persons, Unverified List)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["converge", "embassy", "sanctions", "commerce", "bis"]
categories = ["api-bindings"]

[lib]
name = "embassy_commerce_csl"
path = "src/lib.rs"

[dependencies]
embassy-pack = { package = "converge-embassy-pack", path = "../pack", version = "1.1.1" }
converge-pack.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Live HTTP transport. api.trade.gov CSL endpoint requires an
# api_key (free registration). The `live` feature defaults to
# OpenSanctions' mirror (CC-BY 4.0, no auth); consumers with a
# trade.gov api_key can point at the canonical endpoint via
# LiveFetchOptions::sanctions_url.
manifold = { workspace = true, optional = true, features = ["fetch"] }
tokio = { workspace = true, optional = true, features = ["sync"] }

[features]
default = []
live = ["dep:manifold", "dep:tokio"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
