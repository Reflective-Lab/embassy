[package]
name = "converge-embassy-vies"
description = "VIES port — EU VAT Information Exchange System (typed VatNumber + validation result) for Converge formations."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["converge", "embassy", "vies", "vat", "eu"]
categories = ["api-bindings"]

[lib]
name = "embassy_vies"
path = "src/lib.rs"

[dependencies]
embassy-pack = { package = "converge-embassy-pack", path = "../pack", version = "1.2.0" }
converge-pack.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Live SOAP transport — manifold's POST + XML helpers. No auth
# required for the EU VIES endpoint. chrono is used only to stamp the
# RFC3339 `validated_at` field on each typed result.
manifold = { workspace = true, optional = true, features = ["fetch", "xml"] }
tokio = { workspace = true, optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }

[features]
default = []
live = ["dep:manifold", "dep:tokio", "dep:chrono"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
