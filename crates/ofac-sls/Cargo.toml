[package]
name = "converge-embassy-ofac-sls"
description = "OFAC SLS port — US Treasury Office of Foreign Assets Control Sanctions List Search."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["converge", "embassy", "ofac", "sanctions"]
categories = ["api-bindings"]

[lib]
name = "embassy_ofac_sls"
path = "src/lib.rs"

[dependencies]
embassy-pack = { package = "converge-embassy-pack", path = "../pack", version = "1.1.1" }
converge-pack.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Live HTTP transport for the OFAC SDN CSV feed. Same pattern as
# sec-edgar / gleif: only pulled in when the `live` feature is
# enabled.
manifold = { workspace = true, optional = true, features = ["fetch"] }
tokio = { workspace = true, optional = true, features = ["sync"] }

[features]
default = []
# Bring in the live OFAC SDN transport: HTTP fetch of the published
# CSV feed at
# https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/SDN.CSV
# (no auth required; US Treasury publishes the SDN as public
# information). Tests use canned CSV fixtures; integration test is
# `#[ignore]` and only runs with OFAC_LIVE_TEST=1.
live = ["dep:manifold", "dep:tokio"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
