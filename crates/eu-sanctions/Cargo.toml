[package]
name = "converge-embassy-eu-sanctions"
description = "EU Sanctions port — EU Consolidated Financial Sanctions List."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["converge", "embassy", "sanctions", "eu"]
categories = ["api-bindings"]

[lib]
name = "embassy_eu_sanctions"
path = "src/lib.rs"

[dependencies]
embassy-pack = { package = "converge-embassy-pack", path = "../pack", version = "1.1.1" }
converge-pack.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Live HTTP transport. EU's canonical FSF requires EU-Login; the
# `live` feature defaults to OpenSanctions' mirror of the EU FSF
# (CC-BY 4.0, no auth). Apps with EU credentials can point at the
# canonical endpoint via `LiveFetchOptions::sanctions_url`.
manifold = { workspace = true, optional = true, features = ["fetch"] }
tokio = { workspace = true, optional = true, features = ["sync"] }

[features]
default = []
live = ["dep:manifold", "dep:tokio"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
