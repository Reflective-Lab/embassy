[package]
name = "converge-embassy-ted"
description = "TED port — EU Tenders Electronic Daily; public procurement notices."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["converge", "embassy", "ted", "procurement", "eu"]
categories = ["api-bindings"]

[lib]
name = "embassy_ted"
path = "src/lib.rs"

[dependencies]
embassy-pack = { package = "converge-embassy-pack", path = "../pack", version = "1.1.1" }
converge-pack.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Live HTTP transport — manifold's POST + pagination helpers. TED
# search uses cursor-based pagination via `iterationNextToken`; the
# pagination feature in manifold lands here.
manifold = { workspace = true, optional = true, features = ["fetch", "pagination"] }
tokio = { workspace = true, optional = true }

[features]
default = []
live = ["dep:manifold", "dep:tokio"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
