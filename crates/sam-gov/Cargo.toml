[package]
name = "converge-embassy-sam-gov"
description = "SAM.gov port — US System for Award Management; federal contractor registration."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["converge", "embassy", "sam", "uei", "federal"]
categories = ["api-bindings"]

[lib]
name = "embassy_sam_gov"
path = "src/lib.rs"

[dependencies]
embassy-pack = { package = "converge-embassy-pack", path = "../pack", version = "1.1.1" }
converge-pack.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Live HTTP transport — `from_env()` reads SAM_GOV_API_KEY (free
# registration at api.data.gov/signup/). Fails loud if the var is
# missing; never silently falls back to the stub.
manifold = { workspace = true, optional = true, features = ["fetch"] }
tokio = { workspace = true, optional = true }
urlencoding = { version = "2", optional = true }

[features]
default = []
live = ["dep:manifold", "dep:tokio", "dep:urlencoding"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
