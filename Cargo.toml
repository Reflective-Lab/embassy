[workspace]
resolver = "2"
members = [
    "crates/pack",
    "crates/linkedin",
    "crates/sec-edgar",
    "crates/bolagsverket",
    # Skeleton ports — typed identifier + entity placeholder, Provider
    # trait + stub. Expand each when an app pulls on the corresponding
    # domain; do not grow the entity shape preemptively.
    "crates/uspto",
    "crates/crunchbase",
    "crates/github",
    "crates/pubmed",
    "crates/arxiv",
    "crates/openalex",
    "crates/wikidata",
    "crates/companies-house",
    "crates/scb",
    "crates/epo",
]

[workspace.package]
version = "1.1.1"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
repository = "https://github.com/Reflective-Lab/embassy-ports"

[workspace.dependencies]
# Converge platform — pinned to 3.9.1 (the release that introduced the
# kernel re-exports + polars_bridge). Required by ports that emit
# Suggestors (sec-edgar, bolagsverket, future).
converge-pack = "3.9.1"

# Manifold transport adapters — generic HTTP fetch + HTML extract. Ports
# that need real network/HTML logic (sec-edgar's `live` feature, etc.)
# pull this in optionally; stub-only consumers see no manifold deps.
manifold = { package = "converge-manifold-adapters", version = "1.1.0" }

# Async / HTTP
tokio = { version = "1.48", features = ["full", "macros", "sync"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Common
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
uninlined_format_args = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
wildcard_imports = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
