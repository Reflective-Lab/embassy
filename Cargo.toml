[workspace]
resolver = "2"
members = [
    "crates/pack",
    "crates/linkedin",
    "crates/sec-edgar",
    "crates/bolagsverket",
    # P0 counterparty + sanctions cluster (added 2026-05-17).
    "crates/gleif",
    "crates/vies",
    # P0 sanctions trio — coherent shape across three sources
    # (US Treasury OFAC, EU Consolidated, US Commerce BIS).
    "crates/ofac-sls",
    "crates/eu-sanctions",
    "crates/commerce-csl",
    # P0 US federal counterparty + spend (Q1 + Q3 in one bundle).
    "crates/sam-gov",
    "crates/usaspending",
    # P0 EU + Sweden procurement.
    "crates/ted",
    # P0 Sweden tax — publicly queryable surface only.
    "crates/skatteverket",
    # Skeleton ports — typed identifier + entity placeholder, Provider
    # trait + stub. Expand each when an app pulls on the corresponding
    # domain; do not grow the entity shape preemptively.
    "crates/uspto",
    "crates/crunchbase",
    "crates/github",
    "crates/pubmed",
    "crates/arxiv",
    "crates/openalex",
    "crates/wikidata",
    "crates/companies-house",
    "crates/scb",
    "crates/epo",
]

[workspace.package]
version = "1.3.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
repository = "https://github.com/Reflective-Lab/embassy-ports"

[workspace.dependencies]
# Converge platform — pinned to 3.9.1 (the release that introduced the
# kernel re-exports + polars_bridge). Required by ports that emit
# Suggestors (sec-edgar, bolagsverket, future).
converge-pack = "3.9.1"
converge-manifold-adapters = { path = "../manifold-adapters/crates/manifold" }

# Manifold transport adapters — generic HTTP fetch + HTML extract. Ports
# that need real network/HTML logic (sec-edgar's `live` feature, etc.)
# pull this in optionally; stub-only consumers see no manifold deps.
manifold = { package = "converge-manifold-adapters", version = "1.1.0" }

# Async / HTTP
tokio = { version = "1.48", features = ["full", "macros", "sync"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Common
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
sha2 = { version = "0.10", features = ["default"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
uninlined_format_args = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
wildcard_imports = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Resolve manifold from local source until the crates.io release that
# carries the POST + xml feature additions (search.rs WebFetchMethod /
# WebFetchRequest::with_body / manifold::xml) lands. Drop this patch
# once that release is on crates.io.

[patch.crates-io]
converge-pack         = { path = "../../bedrock-platform/converge/crates/pack" }
converge-manifold-adapters = { path = "../manifold-adapters/crates/manifold" }
converge-kernel       = { path = "../../bedrock-platform/converge/crates/kernel" }
converge-core         = { path = "../../bedrock-platform/converge/crates/core" }
converge-model        = { path = "../../bedrock-platform/converge/crates/model" }
converge-optimization = { path = "../../bedrock-platform/converge/crates/optimization" }
converge-runtime      = { path = "../../bedrock-platform/converge/crates/runtime" }
converge-experience   = { path = "../../bedrock-platform/converge/crates/experience" }
converge-provider     = { path = "../../bedrock-platform/converge/crates/provider" }
organism-pack         = { path = "../../bedrock-platform/organism/crates/pack" }
organism-intent       = { path = "../../bedrock-platform/organism/crates/intent" }
organism-planning     = { path = "../../bedrock-platform/organism/crates/planning" }
organism-adversarial  = { path = "../../bedrock-platform/organism/crates/adversarial" }
organism-simulation   = { path = "../../bedrock-platform/organism/crates/simulation" }
organism-learning     = { path = "../../bedrock-platform/organism/crates/learning" }
organism-runtime      = { path = "../../bedrock-platform/organism/crates/runtime" }
organism-dynamics     = { path = "../../bedrock-platform/organism/crates/dynamics" }

